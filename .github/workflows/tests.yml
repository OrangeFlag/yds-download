name: Tests

on:
  push:
    branches: [main, feat/offline-volume-catalog-20261020]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Validate executable entrypoints
        run: |
          test -x download.py
          test -x start.sh
          bash -n start.sh
          python3 download.py --help > /dev/null
      - name: Run tests
        run: python3 -m unittest discover -v
