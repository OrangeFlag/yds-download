name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2
      - name: Run tests
        run: python3 -m unittest discover -v
